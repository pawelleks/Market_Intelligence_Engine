  MORTGAGE30US: w
  WALCL: w
  STLFSI: w
  NFCI: w
  GDPNOW: d # technically irregular/daily update
  BCNSDODNS: q
  NCBCMDPMVCE: q
  QUSPAM770A: q
  CPATAX: q
  CNCF: q
  GDP: q
  LABSHPUSA156NRUG: a
  CAPUTLB50001SQ: m
  BAA10Y: d
  SP500: d
  USREC: m
  PITGCG01USM661N: m
  PSAVERT: m
  FEDFUNDS: m
  TOTLL: m
  PMSAVE: m
  RSXFS: m
  NEWORDER: m
  T10Y3M: d
  PERMIT: m
  UMCSENT: m
  UMCSENT1: m
  AWHMAN: m
  TB3MS: m
  DGORDER: m
  BSCICP02USM460S: m
