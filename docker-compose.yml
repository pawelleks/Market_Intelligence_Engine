version: '3.8'

services:
  # 1. API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mie-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data               # Persist Data
      - ./config:/app/config           # Live Config
      - ./cli:/app/cli                 # Management CLI
      - ./cli:/app/cli                 # Management CLI
      - ./src:/app/src                 # Live Code Reload (Optional)
      - ./scripts:/app/scripts         # Administrative scripts
      - ./api_server.py:/app/api_server.py # Mount entrypoint for updates
      - ./public_docs:/app/public_docs # Output for reports
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
    restart: unless-stopped
    networks:
      - mie-net

  # 2. Frontend (Production Build served by Nginx)
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    container_name: mie-web
    # Ports removed; traffic handled by Caddy
    # ports:
    #   - "80:80"
    environment:
      - VITE_API_URL=http://api:8000
    volumes:
      - ./public_docs:/usr/share/nginx/html/public_docs
    depends_on:
      - api
    networks:
      - mie-net

  # 4. Caddy Reverse Proxy (HTTPS)
  caddy:
    image: caddy:latest
    container_name: mie-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - web
      - api
    networks:
      - mie-net

  # 3. Cron Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: mie-cron
    volumes:
      - ./data:/app/data               # Share Data with API
      - ./config:/app/config
      - ./logs:/app/logs
      - ./cli:/app/cli                 # Mount CLI for updates
      - ./scripts:/app/scripts         # Administrative scripts
      - ./public_docs:/app/public_docs # Output for reports
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
    restart: unless-stopped
    networks:
      - mie-net

volumes:
  caddy_data:

networks:
  mie-net:
    driver: bridge
