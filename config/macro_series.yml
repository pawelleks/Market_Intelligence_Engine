# Macro Economic Series for FRED Download
# Format: FRED_SERIES_ID: Description

series:
  # --- Inflation ---
  CPIAUCSL: Consumer Price Index (Headline CPI)
  CPILFESL: Core CPI (Ex-Food & Energy)
  PCEPI: PCE Price Index (Headline)
  PCEPILFE: Core PCE Price Index
  PPIFIS: Producer Price Index (PPI)
  T5YIE: 5-Year Breakeven Inflation Rate
  MICH: UMich Inflation Expectations

  # --- Labor Market ---
  UNRATE: Unemployment Rate
  PAYEMS: Nonfarm Payrolls (Total Nonfarm)
  ICSA: Initial Jobless Claims
  JTSJOL: Job Openings (JOLTS)
  CIVPART: Labor Force Participation Rate
  CES0500000003: Average Hourly Earnings
  ECIALLCIV: Employment Cost Index (ECI)
  SAHMREALTIME: Sahm Rule Recession Indicator

  # --- Growth & Output ---
  GDPC1: Real GDP
  GDPNOW: GDPNow (Atlanta Fed)
  PCEC96: Real Personal Consumption
  RSAFS: Retail Sales
  INDPRO: Industrial Production
  DSPIC96: Real Disposable Personal Income

  # --- Interest Rates & Bonds ---
  DFF: Federal Funds Effective Rate
  DGS10: 10-Year Treasury Constant Maturity
  DGS2: 2-Year Treasury Constant Maturity
  T10Y2Y: 10-Year Minus 2-Year Treasury Spread

  # --- Housing ---
  MORTGAGE30US: 30-Year Fixed Mortgage Average
  HOUST: Housing Starts
  HSN1F: New Home Sales
  CSUSHPINSA: Case-Shiller Home Price Index

  # --- Money & Financial Conditions ---
  M2SL: M2 Money Supply
  WALCL: Total Assets (Federal Reserve)
  STLFSI: St. Louis Fed Financial Stress Index
  USREC: NBER Recession Indicator (1=Recession, 0=Expansion)

  # --- Sentiment ---
  UMCSENT: UMich Consumer Sentiment

frequency:
  GDPC1: q
  ECIALLCIV: q
  ICSA: w
  T5YIE: d
  DFF: d
  DGS10: d
  DGS2: d
  T10Y2Y: d
  MORTGAGE30US: w
  WALCL: w
  STLFSI: w
  GDPNOW: d # technically irregular/daily update
